name: CI

on:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: self-hosted

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Verificar Node.js
        run: node --version

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion
        run: npm run build